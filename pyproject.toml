[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "FaceSwap-Pro"
version = "0.4.0"
description = "Pipeline local de reemplazo facial optimizado con InsightFace, tracking temporal, NVDEC/NVENC y procesamiento paralelo."
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
  "insightface==1.0.1",
  "onnxruntime-gpu[cuda,cudnn]==1.28.0",
  "onnx>=1.18,<2",
  "opencv-python-headless>=4.10,<5",
  "numpy>=1.26,<3",
  "scipy>=1.13,<2",
  "PyYAML>=6,<7",
  "typer>=0.16,<1",
  "rich>=13.9,<15",
  "tqdm>=4.66,<5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "ruff>=0.9,<1",
]

[project.scripts]
faceswap-pro = "faceswap_pro.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
pythonpath = ["src"]

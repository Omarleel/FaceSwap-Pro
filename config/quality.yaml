engine:
  backend: insightface_inswapper
  options: {}
  plugins: []
  model_pack: buffalo_l
  det_size: [640, 640]
  det_thresh: 0.55
  allowed_modules:
    - detection
    - recognition
  max_faces: 12
  providers:
    - CUDAExecutionProvider
    - CPUExecutionProvider
  cuda:
    device_id: 0
    arena_extend_strategy: kNextPowerOfTwo
    cudnn_conv_algo_search: EXHAUSTIVE
    cudnn_conv_use_max_workspace: "1"
    do_copy_in_default_stream: "1"
    use_tf32: "1"

identity:
  source_min_score: 0.60
  target_min_similarity: 0.30
  max_source_images: 40

tracking:
  smoothing: 0.72
  max_missing_frames: 6
  scene_cut_threshold: 0.42
  detection_interval: 2
  full_scan_interval: 60
  max_recognition_candidates: 3
  optical_flow: true
  flow_win_size: 31
  flow_max_level: 3
  flow_max_error: 25.0

blend:
  aligned_size: 512
  mask_shrink: 0.88
  mask_blur_ratio: 0.055
  color_match_strength: 0.72
  detail_strength: 0.22
  roi_enabled: true
  roi_margin: 0.18
  interpolation: lanczos

restorer:
  enabled: false
  model_path: models/face_restorer.onnx
  input_size: 512
  output_range: auto

encoding:
  codec: h264_nvenc
  preset: p6
  cq: 17
  audio_bitrate: 256k
  fallback_codec: libx264
  fallback_preset: medium
  fallback_crf: 17

performance:
  decoder: auto
  hardware_decode: true
  reader_queue: 6
  analysis_queue: 3
  writer_queue: 6
  max_inflight: 6
  postprocess_workers: 0
  opencv_threads: 0